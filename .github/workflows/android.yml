name: Build Mapex APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v4

      - name: Rozpakuj projekt
        run: |
          unzip -q MapexAndroid-pobierz.zip -d unpacked
          cp -a unpacked/MapexAndroid/. .

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Zbuduj APK
        run: gradle assembleDebug

      - name: Udostępnij APK
        uses: actions/upload-artifact@v4
        with:
          name: Mapex-APK
          path: app/build/outputs/apk/debug/app-debug.apk
